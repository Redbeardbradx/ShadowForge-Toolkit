[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowforge"
version = "0.2.0"
description = "Self-exposure checker for your own email, username, and name."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "dnspython>=2.4",
    "requests>=2.28",
    "rich>=13.0",
]
authors = [
    {name = "Redbeard Bradx", email = "your@email.com"}
]
license = {text = "MIT"}
keywords = ["self-assessment", "hibp", "privacy"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]

[project.scripts]
shadowforge = "shadowforge.selfcheck.cli:main"

[project.urls]
Homepage = "https://github.com/Redbeardbradx/ShadowForge-Toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/shadowforge/tests"]
pythonpath = ["src"]
